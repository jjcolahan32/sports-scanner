name: card-scanner
# scan.py's own DST-aware market_hours_open() check (zoneinfo,
# America/New_York) decides whether to actually do anything -- exact
# checkpoints are 11am, 12:30pm, 2pm, 5pm, 6:30pm, 8pm, 9pm ET
# (SCAN_CHECKPOINTS_ET in scan.py), not an hourly/2h window. Cron fires every 10 minutes so a
# checkpoint gets caught even if GitHub drops/delays a specific tick (see
# below); the Python gate is what actually decides whether a given tick is
# within grace of a checkpoint. Comparing in ET via zoneinfo means the
# schedule survives DST changes automatically -- a fixed set of UTC times
# would silently drift by an hour each time clocks change.
#
# Offset by :03 from each 10-minute mark (3,13,23,... not 0,10,20,...) --
# GitHub's own docs warn that round-number marks (especially :00) are the
# most congested scheduling windows across all of GitHub Actions, and
# scheduled runs there are prone to being delayed or dropped entirely.
# Confirmed happening here previously with "0 * * * *" hourly cron.
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch: {}          # lets you trigger a manual run from the Actions tab

permissions:
  contents: write                # allow committing state.json back for dedupe

jobs:
  scan:
    runs-on: ubuntu-latest
    concurrency: card-scanner    # never overlap runs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scan
        env:
          ODDS_API_KEY:       ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC:         ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LEAD_HOURS:   "4"
        run: python scan.py
      - name: Render dashboard
        run: python render_dashboard.py
      - name: Persist dedupe + opening-line state + dashboard
        run: |
          git config user.name  "card-scanner"
          git config user.email "bot@users.noreply.github.com"
          git add state.json opens.json card_*.json discord_sent.json last_scan.json docs/index.html docs/history.html || true
          git commit -m "state: $(date -u +%F_%H:%M)" || echo "no change"
          # Retry with rebase on push rejection -- another job (or a manual
          # push) landing first must never cause this run's data to be
          # silently dropped by a bare "push || echo nothing to push".
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, rebasing onto latest main (attempt $i)"
            git fetch origin main
            git rebase origin/main || { echo "rebase conflict -- leaving for manual resolution"; exit 1; }
          done
