name: card-scanner
# Triggered by an external cron service (cron-job.org) calling GitHub's
# workflow_dispatch API every 2h, 11am-9pm ET -- see scan.py's
# SCAN_CHECKPOINTS_ET for the exact checkpoints and the reasoning. No
# `schedule:` trigger here on purpose: GitHub's own scheduler is documented
# best-effort and confirmed unreliable in this repo (dropped most ticks),
# and briefly running it alongside the external trigger caused two sources
# to fire close together -- cancelled runs (concurrency lock) and failed
# runs (git-push contention exhausting the retry budget). workflow_dispatch
# is immediate and on-demand, not best-effort, so the external trigger
# alone is both simpler and more reliable.
on:
  workflow_dispatch: {}          # called by the external cron service, or manually from the Actions tab

permissions:
  contents: write                # allow committing state.json back for dedupe

jobs:
  scan:
    runs-on: ubuntu-latest
    concurrency: card-scanner    # never overlap runs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scan
        env:
          ODDS_API_KEY:       ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC:         ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LEAD_HOURS:   "4"
        run: python scan.py
      - name: Render dashboard
        run: python render_dashboard.py
      - name: Persist dedupe + opening-line state + dashboard
        run: |
          git config user.name  "card-scanner"
          git config user.email "bot@users.noreply.github.com"
          git add state.json opens.json card_*.json discord_sent.json last_scan.json docs/index.html docs/history.html || true
          git commit -m "state: $(date -u +%F_%H:%M)" || echo "no change"
          # Retry with rebase on push rejection -- another job (or a manual
          # push) landing first must never cause this run's data to be
          # silently dropped by a bare "push || echo nothing to push".
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, rebasing onto latest main (attempt $i)"
            git fetch origin main
            git rebase origin/main || { echo "rebase conflict -- leaving for manual resolution"; exit 1; }
          done
