name: totals-scanner
# scan_totals.py's own DST-aware market_hours_open() check decides whether
# to actually do anything -- same exact checkpoints as card-scanner (11am,
# 12:30pm, 2pm, 5pm, 6:30pm, 8pm ET -- SCAN_CHECKPOINTS_ET in scan.py), each
# job tracking its own "fired today" state independently. 6 checks/day for
# each market = 360/month combined, comfortably under the 500 free Odds API
# cap. Cron fires every 10 minutes so a checkpoint gets caught even if
# GitHub drops/delays a specific tick; comparing in ET means the schedule
# survives DST changes automatically.
#
# Offset :08 past each 10-minute mark -- staggered from card-scanner's :03
# and nightly-grader's :27 (none of :08/18/28/38/48/58 land exactly on :27)
# to avoid the top-of-hour GitHub Actions scheduling congestion (see
# card-scanner's scan.yml comment) and keep our own workflows from landing
# in the same minute as each other.
on:
  schedule:
    - cron: "8,18,28,38,48,58 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan_totals:
    runs-on: ubuntu-latest
    concurrency: totals-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run totals scan
        env:
          ODDS_API_KEY:       ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC:         ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scan_totals.py
      - name: Render dashboard
        run: python render_dashboard.py
      - name: Persist dedupe state + dashboard
        run: |
          git config user.name  "totals-scanner"
          git config user.email "bot@users.noreply.github.com"
          git add state_totals.json card_totals_*.json discord_sent.json last_totals.json docs/index.html docs/history.html || true
          git commit -m "totals state: $(date -u +%F_%H:%M)" || echo "no change"
          # Retry with rebase on push rejection -- another job (or a manual
          # push) landing first must never cause this run's data to be
          # silently dropped by a bare "push || echo nothing to push".
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, rebasing onto latest main (attempt $i)"
            git fetch origin main
            git rebase origin/main || { echo "rebase conflict -- leaving for manual resolution"; exit 1; }
          done
