name: nightly-grader
# Triggered by an external cron service (cron-job.org) calling GitHub's
# workflow_dispatch API at exactly midnight, 4am, 11am ET (GRADE_CHECKPOINTS_ET
# in grade.py), then nothing until the next day's midnight.
#
# No `schedule:` trigger here on purpose -- see card-scanner's scan.yml
# comment: GitHub's own scheduler proved unreliable, and running it
# alongside the external trigger caused two sources to collide (cancelled
# and failed runs). Manual dispatch always runs regardless of the hour.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  grade:
    runs-on: ubuntu-latest
    concurrency: nightly-grader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Grade the day
        env:
          NTFY_TOPIC:         ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional: set this secret once you want grading recaps split
          # into their own Discord channel, separate from picks. Unset ->
          # falls back to DISCORD_WEBHOOK_URL automatically, no code change.
          DISCORD_GRADING_WEBHOOK_URL: ${{ secrets.DISCORD_GRADING_WEBHOOK_URL }}
        run: python grade.py
      - name: Render dashboard
        run: python render_dashboard.py
      - name: Persist card + ledger + dashboard
        run: |
          git config user.name  "nightly-grader"
          git config user.email "bot@users.noreply.github.com"
          git add card_*.json ledger.json last_grade.json docs/index.html docs/history.html || true
          git commit -m "grade: $(date -u +%F)" || echo "no change"
          # Retry with rebase on push rejection -- another job (or a manual
          # push) landing first must never cause this run's data to be
          # silently dropped by a bare "push || echo nothing to push".
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, rebasing onto latest main (attempt $i)"
            git fetch origin main
            git rebase origin/main || { echo "rebase conflict -- leaving for manual resolution"; exit 1; }
          done
