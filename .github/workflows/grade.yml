name: nightly-grader
# grade.py's own DST-aware grade_hours_open() check decides whether to
# actually do anything -- exact checkpoints are midnight, 4am, 11am ET
# (GRADE_CHECKPOINTS_ET in grade.py), then nothing until the next day's
# midnight. Cron fires every 10 minutes so a checkpoint gets caught even if
# GitHub drops/delays a specific tick; comparing in ET means the schedule
# survives DST changes automatically. Manual dispatch always runs
# regardless of the hour.
#
# Offset :07 past each 10-minute mark (staggered from card-scanner's :03
# and totals-scanner's :08) -- avoids the top-of-hour GitHub Actions
# scheduling congestion (see card-scanner's scan.yml comment) and keeps our
# own three workflows from landing in the same minute.
on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  grade:
    runs-on: ubuntu-latest
    concurrency: nightly-grader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Grade the day
        env:
          NTFY_TOPIC:         ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional: set this secret once you want grading recaps split
          # into their own Discord channel, separate from picks. Unset ->
          # falls back to DISCORD_WEBHOOK_URL automatically, no code change.
          DISCORD_GRADING_WEBHOOK_URL: ${{ secrets.DISCORD_GRADING_WEBHOOK_URL }}
        run: python grade.py
      - name: Render dashboard
        run: python render_dashboard.py
      - name: Persist card + ledger + dashboard
        run: |
          git config user.name  "nightly-grader"
          git config user.email "bot@users.noreply.github.com"
          git add card_*.json ledger.json last_grade.json docs/index.html docs/history.html || true
          git commit -m "grade: $(date -u +%F)" || echo "no change"
          # Retry with rebase on push rejection -- another job (or a manual
          # push) landing first must never cause this run's data to be
          # silently dropped by a bare "push || echo nothing to push".
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, rebasing onto latest main (attempt $i)"
            git fetch origin main
            git rebase origin/main || { echo "rebase conflict -- leaving for manual resolution"; exit 1; }
          done
