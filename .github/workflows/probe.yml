name: probe
# Temporary diagnostic workflow -- runs probe_injuries.py with real secrets and real
# internet access (this session's sandbox has neither) so its output can be read from
# the job log. Not part of the scan cadence; safe to delete once no longer needed.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run probe
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python probe_injuries.py
